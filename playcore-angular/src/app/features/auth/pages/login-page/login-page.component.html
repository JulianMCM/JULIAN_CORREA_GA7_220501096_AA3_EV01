<section class="auth-page container">
  <div class="row justify-content-end">
    <div class="col-12 col-lg-5">
      <div class="auth-card shadow rounded-4">
        <h1 class="mb-4 text-center">Inicio de Sesión</h1>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input id="email" type="email" class="form-control" formControlName="email" placeholder="ejemplo@correo.com">
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password" placeholder="Ingresa tu contraseña">
          </div>

          @if (errorMessage) {
            <div class="alert alert-danger py-2">{{ errorMessage }}</div>
          }

          <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="loading">
            {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
          </button>
          <a routerLink="/registro" class="btn btn-outline-secondary w-100">Crear cuenta</a>
        </form>
      </div>
    </div>
  </div>
</section>

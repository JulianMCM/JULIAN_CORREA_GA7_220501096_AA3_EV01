  <script>
    // Cargar datos del perfil
    async function loadProfile() {
      try {
        const response = await fetch('backend/perfil.php');
        const data = await response.json();

        if (data.error) {
          alert('Error: ' + data.error);
          window.location.href = 'login.html';
          return;
        }

        // Actualizar información del usuario
        document.getElementById('user-name').textContent = data.usuario.NombreUsuario;
        document.getElementById('user-email').textContent = data.usuario.Correo;
        document.getElementById('user-country').textContent = data.usuario.Pais || 'No especificado';

        // Función para renderizar juegos
        function renderGames(games, containerId) {
          const container = document.getElementById(containerId);
          if (games.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5"><p class="fs-5">No hay juegos en esta categoría.</p></div>';
            return;
          }

          container.innerHTML = games.map(game => `
            <div class="col-md-6 col-lg-4 mb-4">
              <div class="card h-100 shadow-sm border-0 game-card">
                <div class="card-body d-flex flex-column text-center">
                  <div class="game-icon mb-3">
                    <i class="fa-solid fa-gamepad fa-3x text-primary"></i>
                  </div>
                  <h5 class="card-title fw-bold text-dark">${game.nombre}</h5>
                  <p class="card-text text-muted">${game.Genero || 'Sin género'}</p>
                  <p class="card-text fw-bold text-success">$${game.Precio}</p>
                  <p class="card-text small text-muted">Valoración: ${game.ValoracionPromedio || 0}/100</p>
                  <p class="card-text small text-muted">Agregado: ${new Date(game.FechaAdicion || game.FechaAgregado).toLocaleDateString()}</p>
                  <button class="btn btn-primary mt-auto" onclick='viewGameDetail(${JSON.stringify(game)})'>
                    <i class="fa-solid fa-eye me-1"></i>Ver Detalles
                  </button>
                </div>
              </div>
            </div>
          `).join('');
        }

        // Renderizar cada categoría
        renderGames(data.videojuegosAdquiridos, 'owned-games');
        renderGames(data.deseados, 'wishlist-games');
        renderGames(data.seguidos, 'followed-games');

      } catch (error) {
        console.error('Error cargando perfil:', error);
        alert('Error al cargar el perfil');
      }
    }

    // Función para ver detalles del juego
   function viewGameDetail(game) {
  // Guardar juego completo en localStorage
  localStorage.setItem("juegoSeleccionado", JSON.stringify({
    id: game.IdVideojuego,
    nombre: game.nombre,
    precio: game.Precio,
    valoraciones: game.ValoracionPromedio,
    etiqueta: [game.Genero]
  }));

  // Redirigir a detalle
  window.location.href = "detalle-videojuego.html";
}

    // Logout functionality
    document.addEventListener('DOMContentLoaded', function() {
      loadProfile();

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.location.href = 'backend/logout.php';
        });
      }

      // Dropdown hover functionality
      const profileDropdown = document.getElementById('profileDropdown');
      if (profileDropdown) {
        const dropdownMenu = profileDropdown.nextElementSibling;
        
        profileDropdown.addEventListener('mouseenter', function() {
          dropdownMenu.classList.add('show');
        });
        
        profileDropdown.addEventListener('mouseleave', function() {
          setTimeout(() => {
            if (!dropdownMenu.matches(':hover')) {
              dropdownMenu.classList.remove('show');
            }
          }, 100);
        });
        
        dropdownMenu.addEventListener('mouseleave', function() {
          dropdownMenu.classList.remove('show');
        });
      }
    });
  </script>
<script>
function actualizarContadorCarrito() {
  const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
  const contador = document.getElementById("cart-count");

  if (contador) {
    contador.textContent = carrito.length;

    if (carrito.length === 0) {
      contador.style.display = "none";
    } else {
      contador.style.display = "inline-block";
    }
  }
}

document.addEventListener("DOMContentLoaded", actualizarContadorCarrito);
</script>

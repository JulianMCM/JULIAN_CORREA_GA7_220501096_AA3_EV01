<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAYCORE | Registro</title>

  <!-- Bootstrap + FontAwesome (mismas que en login.html) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Tus estilos (ten en cuenta la carpeta 'assests' como la tienes en login.html) -->
  <link rel="stylesheet" href="assests/css/styles.css">

  <!-- JS: validación del registro y accesibilidad -->
  <script defer src="js/register.js"></script>
</head>
<body>

  <!-- NAVBAR (mismo estilo que login) -->
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="login.html">
        <img src="assests/img/logo.png" alt="Logo PLAYCORE" width="40" height="40" class="me-2">
        <span class="fw-bold">PLAYCORE</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavReg">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNavReg">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-gamepad"></i> Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-newspaper"></i> Noticias</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-user"></i> Perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div class="login-container d-flex">
    <!-- Fondo con la misma clase que usa login.html -->
    <div class="background"></div>

    <!-- Contenedor del formulario de registro, alineado a la derecha -->
    <div class="login-box register-box ms-auto me-5 my-auto p-5 shadow rounded">
      <h2 class="mb-4 text-center">Crear Cuenta</h2>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
          <input type="text" id="nombreUsuario" class="form-control" placeholder="Ej: Juan123" required>
        </div>

        <div class="mb-3">
          <label for="emailReg" class="form-label">Correo Electrónico</label>
          <input type="email" id="emailReg" class="form-control" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="mb-3">
          <label for="passwordReg" class="form-label">Contraseña</label>
          <input type="password" id="passwordReg" class="form-control" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="mb-3">
          <label for="pais" class="form-label">País</label>
          <input type="text" id="pais" class="form-control" placeholder="Ej: Colombia" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="aceptoTerminos">
          <label class="form-check-label" for="aceptoTerminos">
            Acepto los términos y condiciones
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Registrarse</button>

        <p class="text-center mb-2">O continuar con:</p>
        <div class="d-flex justify-content-center gap-3 mb-2">
          <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" width="30" alt="Google"></a>
          <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" width="30" alt="Facebook"></a>
        </div>

        <div class="text-center mt-2">
          <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Iniciar sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer (misma estructura que login.html) -->
  <footer class="footer mt-auto py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="social-icons">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" width="25" alt="Instagram"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" width="25" alt="Facebook"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" width="25" alt="Twitter"></a>
      </div>

      <div class="row w-75">
        <div class="col-md-4">
          <h6 class="fw-bold">Sobre nosotros</h6>
          <ul class="list-unstyled">
            <li><a href="#">Quiénes somos</a></li>
            <li><a href="#">Historia</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h6 class="fw-bold">Explora</h6>
          <ul class="list-unstyled">
            <li><a href="#">Artículos</a></li>
            <li><a href="#">Proveedores</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h6 class="fw-bold">Recursos</h6>
          <ul class="list-unstyled">
            <li><a href="#">Blog</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <!-- Menú de accesibilidad (misma estructura que en login.html) -->
  <div class="accessibility-menu">
    <button id="accessibility-btn" class="btn btn-secondary">
      <i class="fa-solid fa-universal-access"></i>
    </button>
    <div class="accessibility-options" id="accessibility-options">
      <button id="toggle-contrast" class="btn btn-light w-100 mb-2">
        <i class="fa-solid fa-adjust"></i> Contraste
      </button>
      <button id="increase-font" class="btn btn-light w-100 mb-2">
        <i class="fa-solid fa-font"></i> A+
      </button>
      <button id="decrease-font" class="btn btn-light w-100">
        <i class="fa-solid fa-font"></i> A-
      </button>
    </div>
  </div>

  <!-- scripts: accesibilidad + bootstrap bundle -->
  <script src="js/accesibilidad.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

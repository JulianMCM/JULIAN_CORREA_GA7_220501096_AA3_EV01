<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYCORE | Carrito de Compras</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assests/css/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="assests/img/logo.png" alt="Logo PLAYCORE" width="40" height="40" class="me-2">
      <span class="fw-bold">PLAYCORE</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-gamepad"></i> Categorías</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-newspaper"></i> Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-user"></i> Perfil</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENEDOR PRINCIPAL -->
 <div class="background"></div>
<main class="carrito-container">
  <div class="container cart-box shadow-lg p-4 rounded">

    <div class="row">

      <!-- LISTA DE PRODUCTOS -->
      <div class="col-lg-7">
        <h3 class="mb-4">Tu Carrito</h3>

        <div id="cart-items">

          <!-- Item 1 -->
          <div class="cart-item d-flex align-items-center p-3 mb-3 rounded shadow-sm">
            <img src="assests/img/game1.jpg" class="cart-img me-3">
            <div class="flex-grow-1">
              <h5 class="mb-1">Nombre del Juego</h5>
              <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i> Eliminar</button>
            </div>
            <h5 class="text-end price-tag mb-0 ms-3">$89.000</h5>
          </div>

          <!-- Item ejemplo extra -->
          <div class="cart-item d-flex align-items-center p-3 mb-3 rounded shadow-sm">
            <img src="assests/img/game2.jpg" class="cart-img me-3">
            <div class="flex-grow-1">
              <h5 class="mb-1">Otro Juego</h5>
              <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i> Eliminar</button>
            </div>
            <h5 class="text-end price-tag mb-0 ms-3">$120.000</h5>
          </div>

        </div>

        <!-- BOTONES INFERIORES -->
        <div class="mt-4 d-flex gap-3 flex-wrap">
          <a href="busqueda-avanzada.html" class="btn btn-secondary">Seguir Comprando</a>
          <button class="btn btn-danger">Eliminar Todos los Artículos</button>
        </div>
      </div>

      <!-- RESUMEN DE COMPRA -->
      <div class="col-lg-5 mt-4 mt-lg-0">
        <div class="summary-box shadow p-4 rounded">
          <h4>Resumen</h4>
          <hr>
          <div class="d-flex justify-content-between">
            <span>Subtotal</span>
            <strong>$209.000</strong>
          </div>
          <div class="d-flex justify-content-between">
            <span>Impuestos</span>
            <strong>$10.000</strong>
          </div>
          <hr>
          <div class="d-flex justify-content-between fs-5">
            <span>Total</span>
            <strong>$219.000</strong>
          </div>
          <button class="btn btn-primary w-100 mt-4">Continuar con el Pago</button>
        </div>
      </div>

    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="footer mt-auto py-4">
  <div class="container d-flex justify-content-between align-items-center">

    <div class="social-icons">
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" width="25"></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" width="25"></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" width="25"></a>
    </div>

    <div class="row w-75">
      <div class="col-md-4">
        <h6 class="fw-bold">Sobre nosotros</h6>
        <ul class="list-unstyled">
          <li><a href="#">Quiénes somos</a></li>
          <li><a href="#">Historia</a></li>
        </ul>
      </div>
      <div class="col-md-4">
        <h6 class="fw-bold">Explora</h6>
        <ul class="list-unstyled">
          <li><a href="#">Artículos</a></li>
          <li><a href="#">Proveedores</a></li>
        </ul>
      </div>
      <div class="col-md-4">
        <h6 class="fw-bold">Recursos</h6>
        <ul class="list-unstyled">
          <li><a href="#">Blog</a></li>
        </ul>
      </div>
    </div>
  </div>
</footer>

<!-- MENÚ DE ACCESIBILIDAD -->
<div class="accessibility-menu">
  <button id="accessibility-btn" class="btn btn-secondary">
    <i class="fa-solid fa-universal-access"></i>
  </button>
  <div class="accessibility-options" id="accessibility-options">
    <button id="toggle-contrast" class="btn btn-light w-100 mb-2"><i class="fa-solid fa-adjust"></i> Contraste</button>
    <button id="increase-font" class="btn btn-light w-100 mb-2"><i class="fa-solid fa-font"></i> A+</button>
    <button id="decrease-font" class="btn btn-light w-100"><i class="fa-solid fa-font"></i> A-</button>
  </div>
</div>

<script src="js/accesibilidad.js"></script>

</body>
</html>

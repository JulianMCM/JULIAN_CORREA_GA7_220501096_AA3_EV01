<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAYCORE | Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="assests/css/styles.css">
  <script defer src="js/validar.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="assests/img/logo.png" alt="Logo PLAYCORE" width="40" height="40" class="me-2">
        <span class="fw-bold">PLAYCORE</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="fa-solid fa-gamepad"></i> Categorías</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="fa-solid fa-newspaper"></i> Noticias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="fa-solid fa-user"></i> Perfil</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="login-container d-flex">
    <!-- Fondo con imagen -->
    <div class="background"></div>

    <!-- Contenedor de inicio de sesión -->
    <div class="login-box ms-auto me-5 my-auto p-5 shadow rounded">
      <h2 class="mb-4 text-center">Inicio de Sesión</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="Ingrese su correo" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
        </div>
        <div class="mb-3 text-start">
          <a href="#" class="text-decoration-none">¿Has olvidado tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Iniciar Sesión</button>
        <button type="button" class="btn btn-secondary w-100 mb-3">Registrarse</button>

        <p class="text-center mb-2">O continuar con:</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" width="30" alt="Google"></a>
          <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" width="30" alt="Facebook"></a>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer mt-auto py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Iconos de redes sociales -->
      <div class="social-icons">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" width="25" alt="Instagram"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" width="25" alt="Facebook"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" width="25" alt="Twitter"></a>
      </div>

      <!-- Columnas de enlaces -->
      <div class="row w-75">
        <div class="col-md-4">
          <h6 class="fw-bold">Sobre nosotros</h6>
          <ul class="list-unstyled">
            <li><a href="#">Quiénes somos</a></li>
            <li><a href="#">Historia</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h6 class="fw-bold">Explora</h6>
          <ul class="list-unstyled">
            <li><a href="#">Artículos</a></li>
            <li><a href="#">Proveedores</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h6 class="fw-bold">Recursos</h6>
          <ul class="list-unstyled">
            <li><a href="#">Blog</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

<!-- Menú de accesibilidad -->
<div class="accessibility-menu">
  <button id="accessibility-btn" class="btn btn-secondary">
    <i class="fa-solid fa-universal-access"></i>
  </button>
  <div class="accessibility-options" id="accessibility-options">
    <button id="toggle-contrast" class="btn btn-light w-100 mb-2">
      <i class="fa-solid fa-adjust"></i> Contraste
    </button>
    <button id="increase-font" class="btn btn-light w-100 mb-2">
      <i class="fa-solid fa-font"></i> A+
    </button>
    <button id="decrease-font" class="btn btn-light w-100">
      <i class="fa-solid fa-font"></i> A-
    </button>
  </div>
</div>

<script src="js/accesibilidad.js"></script>

</body>
</html>

name: Deploy Angular frontend to GitHub Pages

on:
  push:
    branches:
      - API-/-Angular
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playcore-angular/package-lock.json

      - name: Install dependencies
        working-directory: playcore-angular
        run: npm ci

      - name: Build Angular app
        working-directory: playcore-angular
        run: npm run build -- --base-href /JULIAN_CORREA_GA7_220501096_AA3_EV01/

      - name: Copy index.html as 404.html
        run: cp playcore-angular/dist/playcore-angular/browser/index.html playcore-angular/dist/playcore-angular/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playcore-angular/dist/playcore-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
